[package]
name = "living-empires"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "empires"
path = "src/main.rs"

[features]
default = ["native"]
native = ["bevy/3d", "bevy/ui", "bevy/png", "bevy/file_watcher"]

[dependencies]
argon-dev = { path = "../dev/runtime" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log"] }
lightyear = { version = "=0.31.0", default-features = false, features = ["std", "client", "server", "netcode", "udp"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"
