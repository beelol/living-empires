[package]
name = "argon-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "argon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "error-send"] }
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.3"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
